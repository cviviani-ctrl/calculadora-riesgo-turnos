const rangeScore = (ranges,v) => { if(v===0) return 0; for(let r of ranges){ if(v>=r[0]&&v<=r[1]) return r[2]; } return ranges[ranges.length-1][2]; };
const getK1 = v => { const t=[[0,0],[1,7.35],[2,22.05],[3,29.4],[4,44.1],[5,51.45],[6,66.15]]; if(v>=7) return 73.5; return (t.find(r=>r[0]===v)||[0,0])[1]; };

const getK6 = (D,A) => { if(D+A===0) return {val:0,pts:17.5}; const k=(D-A)/(D+A); if(k===1) return {val:k,pts:0}; if(k===-1) return {val:k,pts:35}; const r=[[-1,-.8,31.5],[-.8,-.6,28],[-.6,-.4,24.5],[-.4,-.2,21],[-.2,.2,17.5],[.2,.4,14],[.4,.6,10.5],[.6,.8,7],[.8,1,3.5]]; for(let x of r){ if(k>=x[0]&&k<x[1]) return {val:k,pts:x[2]}; } return {val:k,pts:17.5}; };
const getK7 = h => { const r=[[0,4.99,35],[5,5.5,31.5],[5.51,6,28],[6.01,6.5,21],[6.51,7,21],[7.01,7.5,7],[7.51,8,3.5],[8.01,24,0]]; for(let x of r){ if(h>=x[0]&&h<=x[1]) return x[2]; } return 0; };
const getK8 = v => rangeScore([[0,0,0],[.001,.1,12.6],[.101,.2,25.2],[.201,.3,37.8],[.301,.4,50.4],[.401,.5,63],[.501,.6,75.6],[.601,.7,88.2],[.701,.8,100.8],[.801,.9,113.4],[.901,1,126]],v);
const getK9 = v => rangeScore([[0,0,0],[.001,.2,2.4],[.201,.4,4.8],[.401,.8,7.2],[.801,1,12],[1.001,1.2,14.4],[1.201,1.4,16.8],[1.401,1.6,19.2],[1.601,1.8,21.6],[1.801,7,24]],v);
const getK10 = v => rangeScore([[0,0,0],[.001,.1,12.6],[.101,.2,25.2],[.201,.3,37.8],[.301,.4,50.4],[.401,.5,63],[.501,.6,75.6],[.601,.7,88.2],[.701,.8,100.8],[.801,.9,113.4],[.901,1,126]],v);
const getK11 = v => { const t=[[1,0],[2,.6],[3,1.2],[4,1.8],[5,2.4],[6,3],[7,3.6],[8,4.2],[9,4.8],[10,5.4]]; if(v>10) return 6; return (t.find(r=>r[0]===v)||[1,0])[1]; };
const getK12 = v => { if(v>=6) return 6; const t={1:0,2:1.2,3:2.4,4:3.6,5:4.8,6:6}; return t[v]||0; };
const getK13 = getK12;

// ─── CYCLE ANALYZER ───
const DAYS_ES = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
function analyzeCycle(pattern, reps, startDay, dHours, nHours, hourLimit, morningStart, paidOff, extraShifts) {
  const base = [];
  for (let i = 0; i < pattern.length; i++) {
    if (pattern[i] === "L" && i > 0) {
      let prevIsN = false;
      for (let j = i-1; j >= 0; j--) { if (pattern[j] === "N") { prevIsN = true; break; } if (pattern[j] === "D" || pattern[j] === "L") break; }
      let alreadyS = false;
      for (let j = i-1; j >= 0; j--) { if (base[j] === "S") { alreadyS = true; break; } if (pattern[j] === "N") break; }
      if (prevIsN && !alreadyS) { base.push("S"); continue; }
    }
    base.push(pattern[i]);
  }
  const expanded = [];
  for (let r = 0; r < reps; r++) for (let i = 0; i < base.length; i++) expanded.push(base[i]);
  for (let i = 1; i < expanded.length; i++) { if (expanded[i] === "L" && expanded[i-1] === "N") expanded[i] = "S"; }
  const nt = expanded.length, nw = Math.ceil(nt/7), nStartHour = morningStart + dHours;
  const days = expanded.map((t,i) => { const dow=(startDay+i)%7; let hrs=0; if(t==="D") hrs=dHours; else if(t==="N") hrs=24-nStartHour; else if(t==="S") hrs=nHours-(24-nStartHour); return {type:t,dow,hrs,isWork:t==="D"||t==="N"}; });
  let maxN=0,curN=0; for(const d of days){if(d.type==="N"){curN++;maxN=Math.max(maxN,curN);}else curN=0;}
  const nn=days.filter(d=>d.type==="N").length;
  let maxW=0,curW=0; for(const d of days){if(d.isWork){curW++;maxW=Math.max(maxW,curW);}else curW=0;}
  let weeksOver=0; for(let w=0;w<nw;w++){const wh=days.slice(w*7,(w+1)*7).reduce((s,d)=>s+d.hrs,0);if(wh>hourLimit)weeksOver++;}
  let nu=0; for(let i=0;i<days.length-1;i++){const c=days[i].type,n=days[i+1].type;if(c==="D"&&n==="N"){const rest=24-(morningStart+dHours)+nStartHour;if(rest<11)nu++;}else if(c==="N"&&n==="D")nu++;}
  let rotD=0,rotA=0; for(let i=0;i<days.length-1;i++){if(days[i].type==="D"&&days[i+1].type==="N")rotD++;if(days[i].type==="N"&&days[i+1].type==="D")rotA++;}
  let ns=0,nsd=0; for(let w=0;w<nw;w++){const wd=days.slice(w*7,(w+1)*7);const sat=wd.find(d=>d.dow===5);const sun=wd.find(d=>d.dow===6);const sf=sat&&sat.type==="L";const su=sun&&sun.type==="L";if(!sf&&!su)nsd++;else if((sf&&!su)||(!sf&&su))ns++;}
  let nst=0; for(let w=0;w<nw;w++){if(!days.slice(w*7,(w+1)*7).some(d=>d.type==="L"))nst++;}
  let transitions=0; for(let i=1;i<days.length;i++){if(days[i-1].isWork!==days[i].isWork)transitions++;}
  const types=new Set(days.filter(d=>d.isWork).map(d=>d.type));
  const wb=[],rb=[]; let c2=null,cnt=0;
  for(const d of days){const cat=d.isWork?"W":"R";if(cat===c2)cnt++;else{if(c2)(c2==="W"?wb:rb).push(cnt);c2=cat;cnt=1;}}
  if(c2)(c2==="W"?wb:rb).push(cnt);
  const Lb=wb.length>0?Math.max(...wb)-Math.min(...wb):0, lb=rb.length>0?Math.max(...rb)-Math.min(...rb):0;
  return {days,nt,nw,nn,maxN,maxW,weeksOver,nu,rotD,rotA,ns,nsd,nst,transitions,types:types.size,Lb,lb,paidOff,extraShifts,morningStart,base};
}

// ─── CALCULADORA BESIAK V2 ───
function BesiakV2() {
  const [phase, setPhase] = useState("privacy");
  const [privacyAccepted, setPrivacyAccepted] = useState(false);
  const [showLegalDetail, setShowLegalDetail] = useState(false);
  const [step, setStep] = useState(0);

  const [shiftName, setShiftName] = useState("");

  const gcd = (a,b) => b===0?a:gcd(b,a%b);
  const lcm = (a,b) => (a*b)/gcd(a,b);
  const reps = useMemo(() => { const len=pattern.length; if(len===0) return 1; return lcm(len,7)/len; }, [pattern.length]);
  const addChip = useCallback(t => setPattern(p=>[...p,t]),[]);

  const analysis = useMemo(() => analyzeCycle(pattern,reps,startDay,dHours,nHours,hourLimit,morningStart,paidOff,extraShifts),
    [pattern,reps,startDay,dHours,nHours,hourLimit,morningStart,paidOff,extraShifts]);

  const calc = useMemo(() => {
    const a=analysis,nw=a.nw;
    const k1p=getK1(a.maxN),k2v=a.nt>0?a.nn/a.nt:0,k2p=getK2(k2v),k3p=getK3(a.maxW);
    const k4v=nw>0?a.weeksOver/nw:0,k4p=getK4(k4v),k5v=nw>0?a.nu/nw:0,k5p=getK5(k5v);
    const {val:k6v,pts:k6p}=getK6(a.rotD,a.rotA),k7p=getK7(a.morningStart);
    const k8v=nw>0?(0.43*a.ns+a.nsd)/nw:0,k8p=getK8(k8v);
    const k9v=nw>0?(0.25*a.paidOff+a.extraShifts)/nw:0,k9p=getK9(k9v);
    const k10v=nw>0?a.nst/nw:0,k10p=getK10(k10v),k11p=getK11(nw);
    const k12p=getK12(Math.min(a.transitions,6)),k13p=getK13(a.types);
    const k14raw=getK14val(a.Lb,a.lb),k14p=getK14pts(k14raw);
    const hT=k1p+k2p+k3p+k4p+k5p+k6p+k7p,sT=k8p+k9p+k10p+k11p+k12p+k13p+k14p,total=hT+sT;
    return {indicators:[
      {id:"K1",name:"Noches consecutivas",val:a.maxN,pts:k1p,cat:"SALUD",max:73.5},
      {id:"K2",name:"Dosis noches",val:+k2v.toFixed(3),pts:k2p,cat:"SALUD",max:171.5},
      {id:"K3",name:"Días consec.",val:a.maxW,pts:k3p,cat:"SALUD",max:87.5},
      {id:"K4",name:"Horas >límite/sem",val:+k4v.toFixed(3),pts:k4p,cat:"SALUD",max:87.5},
      {id:"K5",name:"Sec. desfavorables",val:+k5v.toFixed(3),pts:k5p,cat:"SALUD",max:210},
      {id:"K6",name:"Dir. rotación",val:+k6v.toFixed(3),pts:k6p,cat:"SALUD",max:35},
      {id:"K7",name:"Inicio turno AM",val:`${morningStart}:00`,pts:k7p,cat:"SALUD",max:35},

  const rC=calc.risk==="BAJO"?"#00a851":calc.risk==="MEDIO"?"#f9a825":"#d32f2f";

      result.push(p[i]);
    }
    return result;
  },[pattern]);

  const steps=[{t:"Patrón del Turno",i:"🔧"},{t:"Contexto del Ciclo",i:"📅"},{t:"Ajustes",i:"⚙"},{t:"Resultados",i:"📋"}];

            </div>)}
          </div>
          <div style={{background:"#fff",borderRadius:16,padding:28,boxShadow:"0 4px 24px rgba(0,40,80,.08)",border:"1px solid #e8edf2",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
              <h2 style={{margin:0,fontSize:18,color:"#1a2a3a"}}>{steps[step]?.i} {steps[step]?.t}</h2>
              {step<3&&<span style={{fontSize:12,color:"#a0aab4"}}>{step+1}/4</span>}
            </div>
            {renderStep()}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"space-between",marginBottom:16}}>
            <button onClick={()=>step===0?setPhase("disclaimer"):setStep(s=>s-1)} style={{padding:"10px 20px",borderRadius:10,border:"2px solid #d0dbe6",background:"#fff",color:"#1a2a3a",fontWeight:600,cursor:"pointer",fontSize:14}}>← Anterior</button>
            {step<3
              ?<button onClick={()=>setStep(s=>s+1)} style={{padding:"10px 24px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#005b8e,#00a851)",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>Siguiente →</button>
              :<button onClick={()=>setStep(0)} style={{padding:"10px 24px",borderRadius:10,border:"2px solid #005b8e",background:"#fff",color:"#005b8e",fontWeight:700,cursor:"pointer",fontSize:14}}>↺ Recalcular</button>}
          </div>
        </>)}

        <div style={{textAlign:"center",fontSize:10,color:"#a0aab4",marginTop:20,lineHeight:1.5}}>
          Metodología BESIAK — Schönfelder & Knauth (1993), Gissel & Knauth (1998)<br/>
          Adaptación: Castellucci & Viviani — Aloysia / ErgoCare
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BesiakV2/>);
</script>
</body>
</html>
